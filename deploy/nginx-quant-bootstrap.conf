# PASSO 1 (antes de existir certificado): /etc/nginx/sites-available/quant.mixco.com.br
# So responde ao desafio do certbot. NUNCA serve o painel nem pede senha em HTTP.
# Depois de emitir o certificado, troque por deploy/nginx-quant.conf (ver deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name quant.mixco.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
