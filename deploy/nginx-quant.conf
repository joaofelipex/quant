# PASSO 2 (certificado ja emitido): /etc/nginx/sites-available/quant.mixco.com.br
# Porta 80 so renova o certificado e redireciona; o painel e a senha so existem em HTTPS.
limit_req_zone $binary_remote_addr zone=quant_login:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=quant_pw:1m rate=10r/m;   # tentativas de login do painel

server {
    listen 80;
    listen [::]:80;
    server_name quant.mixco.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quant.mixco.com.br;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/quant.mixco.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quant.mixco.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/quant;
    index index.html;

    # painel privado: senha via /etc/nginx/.htpasswd-quant (criada na VM, nunca versionada)
    auth_basic "quant";
    auth_basic_user_file /etc/nginx/.htpasswd-quant;
    limit_req zone=quant_login burst=10 nodelay;

    add_header Strict-Transport-Security "max-age=86400" always;  # suba depois de confirmar que o HTTPS esta estavel
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # painel de controle do runner (quant.control, so em 127.0.0.1): tem tela de login PROPRIA (senha com hash + cookie
    # de sessao; ver quant/auth.py), entao aqui o basic auth do nginx fica desligado. O resto do site continua com ele.
    location = /controle { return 301 /controle/; }
    location = /controle/api/login {
        auth_basic off;
        limit_req zone=quant_pw burst=5 nodelay;     # freio extra por IP, alem do bloqueio do proprio painel
        proxy_pass http://127.0.0.1:8765/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /controle/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;  # '$uri/' deixa '/' cair no index.html (so '$uri' dava 404 na pagina inicial)
    }
}
