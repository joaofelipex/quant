# /etc/nginx/sites-available/quant.mixco.com.br  (o certbot acrescenta o bloco 443 e o redirecionamento sozinho)
server {
    listen 80;
    listen [::]:80;
    server_name quant.mixco.com.br;

    root /var/www/quant;
    index index.html;

    # painel privado: senha via /etc/nginx/.htpasswd-quant (criada na VM, nunca versionada)
    auth_basic "quant";
    auth_basic_user_file /etc/nginx/.htpasswd-quant;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri =404;
    }
}
